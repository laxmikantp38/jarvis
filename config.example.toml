# Copy to config.toml (run.py does this for you on first run).
# config.toml is git-ignored: it is machine state, not source.
#
# Every value here can be overridden by an environment variable using the
# AOS_ prefix and __ for nesting, e.g. AOS_AGENT_NAME or AOS_TELEGRAM__ENABLED.
#
# Secrets never live here. They go to the OS credential store — see
# `python run.py --set-secret <name>`.

# The assistant's display name. This is the ONLY place the name is defined;
# nothing in source hardcodes it (AD-9). Change it here and restart.
agent_name = "Jarvis"

# "dev" or "live".
#   dev  - throwaway database, stub channels, foreground. Cannot message anyone.
#   live - real database, real channels, started by Windows Task Scheduler.
# A dev run can never deliver to a real channel: the adapter set is chosen by
# environment, not by a flag that could be forgotten.
environment = "dev"

# IANA timezone. Timestamps are stored in UTC and evaluated here (AD-16).
timezone = "Asia/Kolkata"

[logging]
level = "INFO"
# Structured JSON to file; human-readable to the console.
json_file = true

[notifications]
# How many ordinary nudges a day are worth your attention. Critical and
# important are never capped; everything else folds into the next briefing
# once this is spent.
daily_budget = 12
# Nothing but critical gets through here. Held, not dropped.
quiet_hours = "23:45-05:45"
# Windows where an interruption would be unwelcome, e.g. the client standup.
blackouts = ["20:00-20:30"]

[goals]
# The headline target. Leave target blank to run without one - the engine
# is goal-agnostic and works perfectly well with nothing set.
target = "10000000"   # rupees
start = "2026-08-10"
deadline = "2027-02-10"

[content]
# You publish daily. This is the morning look at whether tonight has
# anything behind it - early enough to still do something about it.
check_at = "10:00"
# Warn when fewer than this many days of footage remain.
horizon_days = 2

[server]
# The local UI binds to loopback only and is never reachable off this machine (AD-5).
host = "127.0.0.1"
port = 8420

[telegram]
enabled = true
# Your own chat id, so the bot knows where to send. Message your bot once,
# then read it from https://api.telegram.org/bot<TOKEN>/getUpdates
chat_id = ""
# The token is a secret and never belongs in this file. Store it with:
#   python run.py --set-secret telegram_token
